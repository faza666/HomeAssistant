        columns: full
    column_span: 1
  cards: []
- type: sections
  max_columns: 4
  icon: mdi:transmission-tower
  path: ''
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-template-card
      entity: sensor.stuff_room_192_168_0_5_grid_l1_voltage
      primary: Grid
      secondary: '{{ states(entity) }} V'
      icon: mdi:transmission-tower
      color: '{{ ''green'' if states(entity) | float(0) > 180 else ''red'' }}'
      features_position: bottom
      vertical: true
      grid_options:
        columns: full
    - type: statistics-graph
      entities:
      - entity: sensor.stuff_room_deye_grid_import_day
        name: Day Import
        color: orange
      - entity: sensor.stuff_room_deye_grid_import_night
        name: Night Import
        color: green
      days_to_show: 7
      period: day
      chart_type: bar
      stat_types:
      - change
    column_span: 1
  - type: grid
    cards:
    - square: false
      type: grid
      cards:
      - type: statistics-graph
        entities:
        - sensor.stuff_room_192_168_0_5_grid_power
        title: Power
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
