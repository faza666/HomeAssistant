# UI-created template helpers (config entry options)
# Generated by publish_ha_config.sh - do not edit here.
- device_class: power
  name: Custom Battery Power
  state: |
    {{ states("sensor.stuff_room_192_168_0_5_battery_power") | float(0) / 1000
    }}
  state_class: measurement
  template_type: sensor
  unit_of_measurement: kW
- device_class: power
  name: Custom Grid Power
  state: |
    {{ states("sensor.stuff_room_192_168_0_5_grid_power") | float() / 1000
    }}
  state_class: measurement
  template_type: sensor
  unit_of_measurement: kW
- device_class: power
  name: Custom Load Power
  state: |
    {{ states("sensor.stuff_room_192_168_0_5_load_power") | float() / 1000
    }}
  state_class: measurement
  template_type: sensor
  unit_of_measurement: kW
- device_class: power
  name: Custom Solar Power
  state: |
    {{ states("sensor.stuff_room_192_168_0_5_pv_power") | float() / 1000
    }}
  state_class: measurement
  template_type: sensor
  unit_of_measurement: kW
- device_class: monetary
  name: Electricity Cost Month
  state: |
    {% set d = states('sensor.stuff_room_deye_grid_import_day_monthly') | float(0) %}
    {% set n = states('sensor.stuff_room_deye_grid_import_night_monthly') | float(0) %}
    {% set pd = states('input_number.electricity_price_day') | float(0) %}
    {% set pn = states('input_number.electricity_price_night') | float(0) %}
    {{ (d * pd + n * pn) | round(2) }}
  state_class: total
  template_type: sensor
  unit_of_measurement: uah
