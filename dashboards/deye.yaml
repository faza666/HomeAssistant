- type: sections
  title: Import & Cost
  path: grid-import-cost
  icon: mdi:cash-multiple
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: tile
      entity: input_number.electricity_price_day
      name: Денний Тариф
      icon: mdi:white-balance-sunny
      vertical: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      icon_tap_action:
        action: none
      features_position: bottom
      grid_options:
        rows: 1
        columns: full
    - type: tile
      entity: input_number.electricity_price_night
      name: Нічний Тариф
      icon: mdi:weather-night
      vertical: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
      icon_tap_action:
        action: none
      features_position: bottom
      grid_options:
        columns: full
        rows: 1
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: |
        <sub> Остаточна вартість зберігається в 23:59:30 останнього дня місяця </sub>

        {% set cur = now().strftime('%Y-%m') %}
        {% set day = states('sensor.stuff_room_deye_grid_import_day_monthly') | float(0) %}
        {% set night = states('sensor.stuff_room_deye_grid_import_night_monthly') | float(0) %}
        {% set cost = states('sensor.stuff_room_deye_electricity_cost_month') | float(0) %}
        {% set hist = (state_attr('sensor.grid_import_monthly_history', 'months') or [])
           | rejectattr('month', 'eq', cur) | sort(attribute='month', reverse=true) | list %}
        | Місяць | Денний імпорт, kWh | Нічний імпорт, kWh | Імпортовано за міцяць, kWh | Вартість з урахуванням тарифів, UAH |
        |:--|--:|--:|--:|--:|
        | **{{ now().strftime('%b %Y') }}** *(поточний)* | {{ '%.1f' | format(day) }} | {{ '%.1f' | format(night) }} | {{ '%.1f' | format(day + night) }} | **{{ '%.2f' | format(cost) }}** |
        {% for r in hist -%}
        | {{ as_datetime(r.month ~ '-01').strftime('%b %Y') }} | {{ '%.1f' | format(r.day) }} | {{ '%.1f' | format(r.night) }} | {{ '%.1f' | format(r.day + r.night) }} | {{ '%.2f' | format(r.cost) }} |
        {% endfor %}
        {%- if hist %}| **Total** | **{{ '%.1f' | format(hist | sum(attribute='day') + day) }}** | **{{ '%.1f' | format(hist | sum(attribute='night') + night) }}** | **{{ '%.1f' | format(hist | sum(attribute='day') + hist | sum(attribute='night') + day + night) }}** | **{{ '%.2f' | format(hist | sum(attribute='cost') + cost) }}** |{% endif %}
      grid_options:
        columns: 24
        rows: auto
