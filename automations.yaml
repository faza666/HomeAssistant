- id: '1792348014992'
  alias: Switch grid tariff (day/night)
  description: Switches the day-hight electrical tarif meter value
  triggers:
  - trigger: time
    at: 07:00:00
  - trigger: time
    at: '23:00:00'
  - trigger: homeassistant
    event: start
  actions:
  - action: select.select_option
    target:
      entity_id: select.grid_import
    data:
      option: '{{ ''day'' if today_at(''07:00'') <= now() < today_at(''23:00'') else
        ''night'' }}

        '
  mode: single
