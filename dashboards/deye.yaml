# Dashboard 'Deye' (/dashboard-deye), paste into Raw configuration editor
# Generated by publish_ha_config.sh - do not edit here.
views:
- type: sections
  sections:
  - type: grid
    cards:
    - type: custom:power-flow-card-plus
      title: Deye Power Flow
      entities:
        solar:
          entity: sensor.stuff_room_192_168_0_5_pv_power
          icon: mdi:solar-power-variant-outline
        battery:
          entity: sensor.stuff_room_192_168_0_5_battery_power
          state_of_charge: sensor.stuff_room_192_168_0_5_battery
        home:
          entity: sensor.stuff_room_192_168_0_5_load_power
        grid:
          entity:
            consumption: sensor.stuff_room_192_168_0_5_grid_power
            production: sensor.stuff_room_192_168_0_5_external_power
        individual:
        - {}
      clickable_entities: true
      kilo_threshold: 0
      base_decimals: 0
      kilo_decimals: 2
      display_zero_lines:
        mode: show
        transparency: 50
        grey_color:
        - 189
        - 189
        - 189
      min_expected_power: 0
      max_expected_power: 8000
      grid_options:
        rows: 7
        columns: full
    - type: statistics-graph
      grid_options:
        columns: 24
        rows: auto
      entities:
      - entity: sensor.stuff_room_deye_custom_solar_power
        name: Solar
      - entity: sensor.stuff_room_deye_custom_load_power
        name: Load
      - entity: sensor.stuff_room_deye_custom_grid_power
        name: Grid
      days_to_show: 1
      period: 5minute
      chart_type: line
      stat_types:
      - mean
      hide_legend: false
      expand_legend: false
      logarithmic_scale: false
    column_span: 1
  - type: grid
    cards:
    - type: gauge
      entity: sensor.stuff_room_192_168_0_5_battery
      grid_options:
        rows: 4
        columns: 12
      severity:
        green: 70
        yellow: 40
        red: 0
    - type: statistics-graph
      grid_options:
        columns: 24
        rows: auto
      entities:
      - sensor.stuff_room_192_168_0_5_battery
      title: Battery SOC
      days_to_show: 1
      period: 5minute
      chart_type: line
      stat_types:
      - max
      hide_legend: true
      logarithmic_scale: false
      min_y_axis: 0
      max_y_axis: 100
      fit_y_data: false
    column_span: 1
  - type: grid
    cards:
    - type: weather-forecast
      entity: weather.forecast_home
      forecast_type: daily
    - type: statistics-graph
      entities:
      - entity: sensor.stuff_room_192_168_0_5_today_energy_import
        name: Import
        color: red
      - entity: sensor.stuff_room_192_168_0_5_today_production
        name: Production
      - entity: sensor.stuff_room_192_168_0_5_today_load_consumption
        name: Consumption
      days_to_show: 7
      period: day
      chart_type: bar
      stat_types:
      - change
  max_columns: 4
  icon: mdi:cellphone-link
  cards: []
  badges:
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.stuff_room_192_168_0_5_pv_power
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.stuff_room_192_168_0_5_load_power
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.stuff_room_192_168_0_5_grid_power
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: weather.forecast_home
  - type: entity
    show_name: true
    show_state: true
    show_icon: true
    icon: mdi:cash
    entity: sensor.stuff_room_deye_electricity_cost_month
    name: Monthly Cost
  header: {}
- type: sections
  max_columns: 4
  title: Solar Generation
  path: solar-generation
  icon: mdi:solar-power-variant-outline
  sections:
  - type: grid
    cards:
    - square: false
      type: grid
      cards:
      - type: gauge
        entity: sensor.stuff_room_deye_custom_solar_power
        max: 8
        name: Solar Production
      - type: statistics-graph
        entities:
        - sensor.stuff_room_192_168_0_5_today_production
        days_to_show: 7
        period: day
        chart_type: bar
        stat_types:
        - state
      columns: 1
      title: PV Total
      grid_options:
        columns: full
        rows: auto
    - type: statistics-graph
      grid_options:
        columns: full
      entities:
      - entity: sensor.stuff_room_deye_custom_solar_power
        name: Solar Power Generation
      days_to_show: 1
      period: 5minute
      chart_type: line-stack
      stat_types:
      - mean
    column_span: 1
  - type: grid
    cards:
    - square: false
      type: grid
      cards:
      - type: statistics-graph
        entities:
        - entity: sensor.stuff_room_192_168_0_5_pv1_power
          name: PV1
        - entity: sensor.stuff_room_192_168_0_5_pv2_power
          name: PV2
        title: PV Power
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
        - mean
        min_y_axis: 0
        fit_y_data: true
      - type: statistics-graph
        entities:
        - entity: sensor.stuff_room_192_168_0_5_pv1_voltage
          name: PV1
        - entity: sensor.stuff_room_192_168_0_5_pv2_voltage
          name: PV2
        title: PV Voltage
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
        - mean
        min_y_axis: 0
        max_y_axis: 400
        fit_y_data: true
      - type: statistics-graph
        entities:
        - entity: sensor.pv1_current_fixed
          name: PV1
        - entity: sensor.stuff_room_192_168_0_5_pv2_current
          name: PV2
        title: PV Current
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
        - max
      columns: 1
      grid_options:
        columns: full
        rows: 1
    column_span: 1
  cards: []
- type: sections
  icon: mdi:battery-charging
  cards: []
  sections:
  - type: grid
    cards:
    - type: gauge
      entity: sensor.stuff_room_192_168_0_5_battery
      needle: false
      severity:
        green: 70
        yellow: 40
        red: 0
      name: Battery SOC
    - type: statistics-graph
      entities:
      - sensor.stuff_room_192_168_0_5_battery
      days_to_show: 1
      period: hour
      chart_type: line-stack
      stat_types:
      - mean
  - type: grid
    cards:
    - type: statistics-graph
      entities:
      - sensor.stuff_room_deye_custom_battery_power
      days_to_show: 1
      period: hour
      chart_type: line
      stat_types:
      - mean
      - min
      - max
      hide_legend: true
    - type: statistics-graph
      entities:
      - entity: sensor.stuff_room_192_168_0_5_today_battery_charge
        name: Charge
        color: light-green
      - entity: sensor.stuff_room_192_168_0_5_today_battery_discharge
        name: Discharge
        color: deep-orange
      days_to_show: 7
      period: day
      chart_type: bar
      stat_types:
      - state
    column_span: 1
  - type: grid
    cards:
    - type: statistics-graph
      entities:
      - sensor.stuff_room_192_168_0_5_battery_current
      title: Current
      days_to_show: 1
      period: 5minute
      chart_type: line-stack
      stat_types:
      - max
      hide_legend: true
    - type: statistics-graph
      entities:
      - sensor.stuff_room_192_168_0_5_battery_temperature
      title: Temperature
      days_to_show: 1
      period: 5minute
      chart_type: line-stack
      stat_types:
      - max
      hide_legend: true
      logarithmic_scale: false
    - type: statistics-graph
      entities:
      - sensor.stuff_room_192_168_0_5_battery_voltage
      title: Voltage
      days_to_show: 1
      period: 5minute
      chart_type: line-stack
      stat_types:
      - max
      hide_legend: true
  header:
    layout: center
    badges_position: bottom
    badges_wrap: wrap
  badges:
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.stuff_room_192_168_0_5_battery_power
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.stuff_room_192_168_0_5_battery_voltage
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.stuff_room_192_168_0_5_battery_current
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.stuff_room_192_168_0_5_battery_temperature
  - type: entity
    show_name: false
    show_state: true
    show_icon: true
    entity: sensor.stuff_room_192_168_0_5_battery_capacity
  max_columns: 3
- type: sections
  max_columns: 4
  icon: mdi:home-lightning-bolt
