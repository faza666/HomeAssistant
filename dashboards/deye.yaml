  - type: grid
    cards:
    - type: heading
      heading: Home Load
      heading_style: title
      icon: mdi:home-import-outline
    - square: false
      type: grid
      cards:
      - type: statistics-graph
        entities:
        - entity: sensor.stuff_room_deye_custom_load_power
          name: Load Power
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
        - mean
        hide_legend: false
      - type: statistics-graph
        entities:
        - sensor.stuff_room_192_168_0_5_load_l1_voltage
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
        - mean
        hide_legend: false
      - type: statistics-graph
        entities:
        - sensor.stuff_room_192_168_0_5_load_l1_current
        days_to_show: 1
        period: 5minute
        chart_type: line
        stat_types:
        - mean
        hide_legend: false
